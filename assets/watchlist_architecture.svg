<svg width="900" height="820" viewBox="0 0 900 820" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="820" fill="#F7F8FB"/>

  <text x="450" y="45" text-anchor="middle" font-size="24" font-weight="700" fill="#1A1A2E">Smart Market Watchlist — Architecture</text>
  <text x="450" y="70" text-anchor="middle" font-size="13" fill="#6B6B7A">Groww Code 2026</text>

  <!-- Frontend -->
  <rect x="60" y="100" width="780" height="90" rx="14" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
  <text x="85" y="132" font-size="17" font-weight="700" fill="#26215C">Frontend — React 18 + Vite 5</text>
  <text x="85" y="156" font-size="13" fill="#3C3489">Vanilla CSS (Groww-inspired), lucide-react icons</text>
  <text x="85" y="176" font-size="13" fill="#3C3489">REST polling + auto "viewed" acknowledgment</text>

  <line x1="450" y1="190" x2="450" y2="218" stroke="#8A8A99" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Backend -->
  <rect x="60" y="218" width="780" height="90" rx="14" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.2"/>
  <text x="85" y="250" font-size="17" font-weight="700" fill="#042C53">Backend — Node.js + Express 4.21</text>
  <text x="85" y="274" font-size="13" fill="#0C447C">ECMAScript modules · RESTful routes · CORS middleware</text>
  <text x="85" y="294" font-size="13" fill="#0C447C">Serves static production frontend build</text>

  <line x1="450" y1="308" x2="450" y2="336" stroke="#8A8A99" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Data ingestion -->
  <rect x="60" y="336" width="780" height="150" rx="14" fill="#F5FBF8" stroke="#1D9E75" stroke-width="1.2"/>
  <text x="85" y="366" font-size="17" font-weight="700" fill="#04342C">Data ingestion engine</text>

  <rect x="85" y="382" width="345" height="82" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
  <text x="105" y="410" font-size="14" font-weight="700" fill="#04342C">Live: yahoo-finance2 (v4.0.2)</text>
  <text x="105" y="430" font-size="12" fill="#0F6E56">NSE symbols · TCS, INFY, RELIANCE,</text>
  <text x="105" y="447" font-size="12" fill="#0F6E56">HDFC, WIPRO · 8s fetch timeout race</text>

  <rect x="470" y="382" width="345" height="82" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
  <text x="490" y="410" font-size="14" font-weight="700" fill="#412402">Fallback: random-walk simulator</text>
  <text x="490" y="430" font-size="12" fill="#854F0B">Geometric random walk</text>
  <text x="490" y="447" font-size="12" fill="#854F0B">~5% probability of news-jump events</text>

  <text x="450" y="478" text-anchor="middle" font-size="12" fill="#5F5E5A" font-style="italic">Falls back automatically on API failure, timeout, or bad data</text>

  <line x1="450" y1="486" x2="450" y2="514" stroke="#8A8A99" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Persistence -->
  <rect x="60" y="514" width="780" height="120" rx="14" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/>
  <text x="85" y="546" font-size="17" font-weight="700" fill="#4A1B0C">Persistence — SQLite 3 (better-sqlite3 v11.8.1)</text>
  <text x="85" y="570" font-size="13" fill="#712B13">WAL journal mode (non-blocking concurrent reads/writes)</text>
  <text x="85" y="590" font-size="13" fill="#712B13">Foreign keys enforced · composite indexing on price_history</text>
  <text x="85" y="610" font-size="13" fill="#712B13">Tables: users · watchlist_items · price_history · last_viewed</text>

  <line x1="450" y1="634" x2="450" y2="662" stroke="#8A8A99" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Testing -->
  <rect x="60" y="662" width="780" height="80" rx="14" fill="#FBEAF0" stroke="#D4537E" stroke-width="1.2"/>
  <text x="85" y="692" font-size="17" font-weight="700" fill="#4B1528">Testing — native node:assert (zero third-party deps)</text>
  <text x="85" y="714" font-size="13" fill="#993556">Unit (17 assertions) · Resilience (live/fallback) · E2E (API lifecycle)</text>

  <line x1="450" y1="742" x2="450" y2="762" stroke="#8A8A99" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Deployment -->
  <rect x="210" y="762" width="480" height="46" rx="12" fill="#F1EFE8" stroke="#888780" stroke-width="1.2"/>
  <text x="450" y="790" text-anchor="middle" font-size="14" font-weight="700" fill="#2C2C2A">Deployed as one process on Render.com</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8A8A99" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
</svg>
